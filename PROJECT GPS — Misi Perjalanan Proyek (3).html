function gdel(id,b){if(!b.dataset.s){b.dataset.s=1;b.textContent="Klik lagi untuk menghapus";return}delete GL[id];if(galc){try{galc.doc(id).delete().catch(()=>{})}catch(e){}}else{try{localStorage.setItem("gps3g",JSON.stringify(GL))}catch(e){}}gx();toast("Karya dihapus");go()}
function gx(){$("#md").classList.remove("on")}
$("#md").addEventListener("click",e=>{if(e.target.id=="md")gx()});
